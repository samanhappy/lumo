services:
  app:
    build: .
    image: ${APP_IMAGE:-lumo-local}
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      PORT: 5173
      LUMO_USERS: ${LUMO_USERS:?Set LUMO_USERS in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lumo
      PGUSER: lumo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:5173/api/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: lumo
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
